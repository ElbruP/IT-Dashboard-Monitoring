# =====================================================================
# nginx fuer den Zugriff ueber die IP-Adresse
#
# Verwendung, wenn kein Name im DNS hinterlegt ist. Das Zertifikat ist
# selbst ausgestellt; der Browser warnt beim ersten Aufruf. Das ist in
# der Projektdokumentation zu benennen.
#
# Ablage: /etc/nginx/sites-available/monitoring
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name 192.168.220.50;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 192.168.220.50;

    ssl_certificate     /etc/ssl/certs/itinfo.crt;
    ssl_certificate_key /etc/ssl/private/itinfo.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # Kein Strict-Transport-Security: bei einem Zugriff ueber die
    # IP-Adresse wird die Vorgabe von Browsern ohnehin verworfen.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    client_max_body_size 1m;
    access_log /var/log/nginx/monitoring-zugriff.log;
    error_log  /var/log/nginx/monitoring-fehler.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
