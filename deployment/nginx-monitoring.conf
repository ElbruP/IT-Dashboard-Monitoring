# =====================================================================
# nginx als vorgelagerter Reverse Proxy
#
# Die Anwendung selbst lauscht ausschliesslich auf 127.0.0.1:8000 und ist
# damit aus dem Netz nicht unmittelbar erreichbar. nginx nimmt die
# Anfragen entgegen, beendet die TLS-Verschluesselung und leitet weiter.
#
# Ablage: /etc/nginx/sites-available/monitoring
# Aktivieren:
#   ln -s /etc/nginx/sites-available/monitoring /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# =====================================================================

# Unverschluesselte Aufrufe werden umgeleitet. Ausnahme ist der Pfad,
# ueber den Let's Encrypt die Verfuegungsberechtigung prueft.
server {
    listen 80;
    listen [::]:80;
    server_name BEISPIEL.DE;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name BEISPIEL.DE;

    # Von certbot erzeugt, siehe INSTALLATION.md
    ssl_certificate     /etc/letsencrypt/live/BEISPIEL.DE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/BEISPIEL.DE/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    # Sicherheitsbezogene Kopfzeilen
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # Die Oberflaeche bindet keine fremden Ressourcen ein. Die Richtlinie
    # kann deshalb eng gefasst werden.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self'; \
         img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    # Groesse begrenzen: die Anwendung nimmt keine Dateien entgegen.
    client_max_body_size 1m;

    access_log /var/log/nginx/monitoring-zugriff.log;
    error_log  /var/log/nginx/monitoring-fehler.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Die Abfrage der Quellen kann laenger dauern als eine gewoehnliche
        # Anfrage, etwa wenn ein Anbieter langsam antwortet.
        proxy_read_timeout 120s;
    }
}
